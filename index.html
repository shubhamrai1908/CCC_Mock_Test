<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCC Mock Test Simulator</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1c2535;--mute:#5d6a80;--line:#d8deea;--accent:#2f4bb8;--ok:#1b7f4b;--okbg:#e4f5ec;--bad:#b3261e;--badbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root{--bg:#141a26;--card:#1e2638;--ink:#e8ecf5;--mute:#9aa6bd;--line:#33405a;--accent:#8ea2f0;--ok:#5fd394;--okbg:#17352a;--bad:#ff8a80;--badbg:#3a1f20}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 1.5rem Georgia,serif;margin:8px 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:12px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mute{color:var(--mute);font-size:.9rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.expl{margin-top:12px;padding:12px 14px;border-left:4px solid var(--ok);background:var(--okbg);border-radius:4px}
.expl.bad{border-color:var(--bad);background:var(--badbg)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent)}
.score{font:700 3rem Georgia,serif}
.toolbar{margin-top:24px;padding-top:14px;border-top:1px solid var(--line)}
.toolbar label{display:inline-block}
</style>
</head>
<body>
<main id="app"></main>
<script src="questions.js"></script>
<script>
(function(){
  const app = document.getElementById('app');
  const KEY = 'mocktest_v1';
  let D = window.QUIZ_DATA;
  // Questions imported through the app (saved in this browser) override questions.js
  try { const o = JSON.parse(localStorage.getItem(KEY + '_data')); if (o && o.questions) D = o; } catch(e){}
  let best = {};
  try { best = JSON.parse(localStorage.getItem(KEY + '_best')) || {}; } catch(e){}
  let st = null, timer = null;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const saveBest = (id, pct) => { if (!(best[id] >= pct)) best[id] = pct; try { localStorage.setItem(KEY + '_best', JSON.stringify(best)); } catch(e){} };

  function home(){
    clearInterval(timer);
    const items = D.chapters.map(c => {
      const n = D.questions.filter(q => q.chapter === c.id).length;
      const b = best[c.id] != null ? ' · Best: ' + best[c.id] + '%' : '';
      return `<div class="card row"><div><strong>${esc(c.name)}</strong><div class="mute">${n} questions${c.timed ? ' · ' + D.mockMinutes + ' min timer' : ''}${b}</div></div>
        <button class="primary" data-start="${esc(c.id)}" ${n ? '' : 'disabled'}>Start</button></div>`;
    }).join('');
    app.innerHTML = `<h1>${esc(D.title)}</h1>${items}
      <div class="toolbar mute">
        <label><input type="checkbox" id="shuf" checked> Shuffle questions</label><br><br>
        <button id="imp">Import questions (JSON)</button>
        <button id="exp">Export questions (JSON)</button>
        <button id="rst">Reset to questions.js</button>
        <input type="file" id="file" accept=".json" hidden>
      </div>`;
    app.querySelectorAll('[data-start]').forEach(b => b.onclick = () => start(b.dataset.start, document.getElementById('shuf').checked));
    document.getElementById('imp').onclick = () => document.getElementById('file').click();
    document.getElementById('file').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { try { const o = JSON.parse(r.result); if (!o.questions || !o.chapters) throw 0; localStorage.setItem(KEY + '_data', JSON.stringify(o)); location.reload(); } catch(x){ alert('Invalid file. It needs "chapters" and "questions".'); } };
      r.readAsText(f);
    };
    document.getElementById('exp').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 2)], {type: 'application/json'}));
      a.download = 'questions.json'; a.click();
    };
    document.getElementById('rst').onclick = () => { try { localStorage.removeItem(KEY + '_data'); } catch(e){} location.reload(); };
  }

  function start(id, doShuffle){
    const ch = D.chapters.find(c => c.id === id);
    let qs = D.questions.filter(q => q.chapter === id);
    if (doShuffle) qs = shuffle(qs);
    st = { ch, qs, i: 0, sel: null, done: false, right: 0, wrong: [], left: ch.timed ? D.mockMinutes * 60 : null };
    clearInterval(timer);
    if (st.left) timer = setInterval(() => { st.left--; const t = document.getElementById('t'); if (t) t.textContent = fmt(st.left); if (st.left <= 0) result(); }, 1000);
    show();
  }
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

  function show(){
    const q = st.qs[st.i], L = ['A','B','C','D','E','F'];
    const opts = q.options.map((o, k) => {
      let cls = 'opt';
      if (st.done) { if (k === q.answer) cls += ' ok'; else if (k === st.sel) cls += ' bad'; }
      else if (k === st.sel) cls += ' sel';
      return `<button class="${cls}" data-k="${k}" ${st.done ? 'disabled' : ''}>${L[k]}. ${esc(o)}</button>`;
    }).join('');
    const good = st.sel === q.answer;
    const expl = st.done ? `<div class="expl ${good ? '' : 'bad'}"><strong>${good ? 'Correct.' : 'Incorrect. Correct answer: ' + L[q.answer] + '.'}</strong>${q.explanation ? '<br>' + esc(q.explanation) : ''}</div>` : '';
    const last = st.i === st.qs.length - 1;
    app.innerHTML = `<div class="row mute"><span>${esc(st.ch.name)} · Question ${st.i + 1} of ${st.qs.length}</span>${st.left != null ? `<span>Time left: <strong id="t">${fmt(st.left)}</strong></span>` : ''}</div>
      <div class="bar"><i style="width:${(st.i / st.qs.length) * 100}%"></i></div>
      <div class="card"><p><strong>${esc(q.q)}</strong></p>${opts}${expl}
      <div class="row" style="margin-top:14px"><button id="quit">Exit test</button>
      ${st.done ? `<button class="primary" id="next">${last ? 'See result' : 'Next question'}</button>` : `<button class="primary" id="sub" ${st.sel == null ? 'disabled' : ''}>Submit answer</button>`}</div></div>`;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => { if (!st.done) { st.sel = +b.dataset.k; show(); } });
    document.getElementById('quit').onclick = () => { if (confirm('Exit this test? Your progress will be lost.')) home(); };
    const sub = document.getElementById('sub');
    if (sub) sub.onclick = () => { st.done = true; if (st.sel === q.answer) st.right++; else st.wrong.push({ q, sel: st.sel }); show(); };
    const nx = document.getElementById('next');
    if (nx) nx.onclick = () => { if (last) result(); else { st.i++; st.sel = null; st.done = false; show(); } };
  }

  function result(){
    clearInterval(timer);
    const total = st.qs.length, pct = Math.round((st.right / total) * 100), L = ['A','B','C','D','E','F'];
    saveBest(st.ch.id, pct);
    const rev = st.wrong.map(w => `<div class="card"><p><strong>${esc(w.q.q)}</strong></p>
      <div class="mute">Your answer: ${w.sel == null ? 'Not answered' : L[w.sel] + '. ' + esc(w.q.options[w.sel])}</div>
      <div>Correct: ${L[w.q.answer]}. ${esc(w.q.options[w.q.answer])}</div><div class="mute">${esc(w.q.explanation || '')}</div></div>`).join('');
    app.innerHTML = `<h1>Result</h1><div class="card"><div class="score">${pct}%</div><p>${st.right} correct out of ${total} in ${esc(st.ch.name)}.</p>
      <button class="primary" id="home">Back to chapters</button></div>${st.wrong.length ? '<h2>Review wrong answers</h2>' + rev : ''}`;
    document.getElementById('home').onclick = home;
  }

  home();
})();
</script>
</body>
</html>
